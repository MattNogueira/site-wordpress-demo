name: Deploy Wordpress Demo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2122 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy files via rsync
        run: |
          rsync -avz --delete \
            --exclude-from='.rsyncignore' \
            -e "ssh -p 2122 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/apps/site-wordpress-demo/

      - name: Deploy containers
        run: |
          ssh -p 2122 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            set -e

            cd "/srv/apps/site-wordpress-demo"

            if [ ! -f .env ]; then
              echo ".env não encontrado no servidor. Abortando deploy."
              exit 1
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps
          EOF